<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Adicionado para permitir o teste da simulação mobile no notebook com F12 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Postagem - BingoLú</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <h1>BingoLú Pets</h1>
    <div class="menu">
        <a href="/feed">Feed</a>
        <a href="/meus_posts">Meus Pets</a>
        <a href="/meus_avistamentos">Avistamentos</a>
        <a href="/post_pet" class="ativo">Nova Postagem</a>
        <a href="/logout">Sair</a>
    </div>
</div>

<h2 class="titulo-pagina">Cadastrar Animal Perdido</h2>
<p class="subtitulo">Informe os dados abaixo para que outras pessoas possam ajudá-lo a localizar seu pet.</p>

<form method="POST" enctype="multipart/form-data" class="formulario-pet">

    <label>Nome do animal</label>
    <input type="text" name="nome" required>

    <!-- Nova Funcionalidade: Espécie -->
    <label>Espécie</label>
    <select name="especie" id="especie" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
        <option value="" disabled selected>Selecione a espécie</option>
        <option value="Canino">Canino</option>
        <option value="Felino">Felino</option>
        <option value="Réptil">Réptil</option>
        <option value="Roedor">Roedor</option>
        <option value="Anfíbio">Anfíbio</option>
        <option value="Ave">Ave</option>
    </select>

    <!-- Nova Funcionalidade Condicional: Porte (Inicia escondido via CSS) -->
    <div id="campo-porte" style="display: none;">
        <label>Porte do Cão</label>
        <select name="porte" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="" disabled selected>Selecione o porte</option>
            
            <option value="Pequeno">Pequeno</option>
            <option value="Médio">Médio</option>
            <option value="Grande">Grande</option>
            
        </select>
    </div>

    <!-- Nova Funcionalidade: Sexo -->
    <label>Sexo</label>
    <select name="sexo" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">
        <option value="" disabled selected>Selecione o sexo</option>
        <option value="Macho">Macho</option>
        <option value="Fêmea">Fêmea</option>
    </select>

    <!-- Descrição agora serve explicitamente como Observações do usuário -->
    <label>Observações / Descrição</label>
    <textarea name="descricao" rows="5" placeholder="Ex: Tem uma mancha branca na pata, é arisco, atende pelo nome de..." required></textarea>

    <label>Cidade</label>
    <input type="text" name="cidade" required>

    <label>Contato</label>
<input
type="text"
id="contato"
name="contato"
placeholder="Telefone ou WhatsApp"
maxlength="15"
required>


    <label>Foto do animal</label>
    <input type="file" name="imagem" accept=".jpg,.jpeg,.png" required>

    <button type="submit" class="botao-principal">Publicar Anúncio</button>

</form>

<!-- JavaScript para controlar a exibição do Porte apenas para Caninos -->
<script>
    const selectEspecie = document.getElementById('especie');
    const divPorte = document.getElementById('campo-porte');

    selectEspecie.addEventListener('change', function() {
        if (this.value === 'Canino') {
            divPorte.style.display = 'block'; // Mostra o campo se for Canino
        } else {
            divPorte.style.display = 'none';  // Esconde para qualquer outra espécie
        }
    });
</script>

<script>
    // Aplica a máscara de telefone (XX) XXXXX-XXXX automaticamente enquanto digita
    document.getElementById('contato').addEventListener('input', function (e) {
        let r = e.target.value.replace(/\D/g, '');
        if (r.length > 11) r = r.substring(0, 11);
        if (r.length > 6) {
            e.target.value = '(' + r.substring(0, 2) + ') ' + r.substring(2, 7) + '-' + r.substring(7);
        } else if (r.length > 2) {
            e.target.value = '(' + r.substring(0, 2) + ') ' + r.substring(2);
        } else if (r.length > 0) {
            e.target.value = '(' + r;
        }
    });
</script>

</body>
</html>
