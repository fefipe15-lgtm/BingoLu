<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Criar conta - BingoLú</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="pagina-login">

<div class="conteudo-login">

    <div class="apresentacao-login">

        <h1 class="logo-login">
            BingoLú
        </h1>

        <h2>
            Faça parte do BingoLú!
        </h2>

        <p class="descricao-login">
            Crie sua conta para divulgar pets perdidos,
            informar avistamentos e ajudar animais a
            encontrarem o caminho de volta para casa.
        </p>

    </div>


    <div class="card-login">

        <h2>
            Criar minha conta
        </h2>

        <p class="subtitulo-login">
            Preencha seus dados para começar.
        </p>


        <form action="/cadastro" method="POST">

            <input
                type="text"
                name="nome"
                placeholder="Nome"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <!-- Campo de Telefone com máscara automática -->
            <input
                type="text"
                id="telefone"
                name="telefone"
                placeholder="Telefone (DDD + Número)"
                maxlength="15"
                required
            >

            <!-- Campo de CEP com máscara automática -->
            <input
                type="text"
                id="cep"
                name="cep"
                placeholder="CEP"
                maxlength="9"
                required
            >

            <input
                type="text"
                name="cidade"
                placeholder="Cidade"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <!-- JavaScript para aplicar as máscaras em tempo real na tela -->
        <script>
            // Máscara de Telefone: (XX) XXXXX-XXXX ou (XX) XXXX-XXXX
            document.getElementById('telefone').addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            });

            // Máscara de CEP: XXXXX-XXX
            document.getElementById('cep').addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,5})(\d{0,3})/);
                e.target.value = !x[2] ? x[1] : x[1] + '-' + x[2];
            });
        </script>



        <p class="link-secundario">

            Já possui uma conta?

            <a href="/login">
                Entrar
            </a>

        </p>

    </div>


    <div class="proposito-login">

        <span>
            Encontrar
        </span>

        <span class="separador">
            •
        </span>

        <span>
            Avisar
        </span>

        <span class="separador">
            •
        </span>

        <span>
            Reencontrar
        </span>

    </div>

</div>

</body>

</html>
